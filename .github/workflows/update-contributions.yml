name: Update GitHub contributions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "build_contributions.py"
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution graphs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Azka79
        run: python build_contributions.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-dark.svg assets/contributions-light.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update GitHub contributions"
            git push
          fi